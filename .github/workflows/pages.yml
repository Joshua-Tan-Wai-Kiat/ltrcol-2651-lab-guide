name: Build and publish lab guide

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install documentation dependencies
        run: python -m pip install -r requirements.txt
      - name: Set the GitHub Pages URL
        env:
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          repo = os.environ['REPOSITORY'].split('/', 1)[1]
          owner = os.environ['OWNER'].lower()
          suffix = '' if repo.lower() == f'{owner}.github.io' else f'{repo}/'
          with Path('mkdocs.yml').open('a', encoding='utf-8') as config:
              config.write(f'\nsite_url: https://{owner}.github.io/{suffix}\n')
          PY
      - name: Build and check links
        run: |
          python scripts/check_public_content.py
          python -m mkdocs build --strict
          python scripts/check_site.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
